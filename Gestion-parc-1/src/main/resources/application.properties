spring.application.name=gestion-parc

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:gestionparc
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration (if using JWT)
jwt.secret=gestionParcSecretKey2024
jwt.expiration=86400000

# MySQL Configuration (Production - uncomment to use)
#spring.datasource.url=jdbc:mysql://localhost:3306/gestion_parc?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=your_password
